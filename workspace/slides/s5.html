<!DOCTYPE html>
<html><head><style>
html { background: #0B1120; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background-image: url('bg-grad.png'); background-size: cover;
  font-family: Arial, sans-serif; display: flex; align-items: center; justify-content: center;
}
.left-bar {
  position: absolute; left: 0; top: 0; bottom: 0; width: 8pt;
  background: #7C3AED;
}
.main { text-align: center; margin: 40pt 100pt; }
.tag { margin: 0 0 16pt 0; }
.tag p { color: #10B981; font-size: 13pt; font-weight: bold; letter-spacing: 3pt; margin: 0; }
h1 { color: #FFFFFF; font-size: 36pt; margin: 0 0 20pt 0; }
.divider { width: 80pt; height: 4pt; background: #10B981; margin: 0 auto 24pt auto; }
.big-p { color: #D1D5DB; font-size: 14pt; line-height: 1.7; margin: 0 0 28pt 0; }
.grid { display: flex; gap: 20pt; justify-content: center; }
.card { width: 160pt; background: rgba(255,255,255,0.05); padding: 20pt 16pt; border-radius: 4pt; text-align: center; }
.card h3 { color: #FFFFFF; font-size: 13pt; margin: 0 0 8pt 0; }
.card p { color: #9CA3AF; font-size: 10pt; line-height: 1.5; margin: 0; }
</style></head>
<body>
<div class="left-bar"></div>
<div class="main">
  <div class="tag"><p>LOOKING AHEAD</p></div>
  <h1>拥抱智能时代</h1>
  <div class="divider"></div>
  <div class="big-p"><p>AI 不是替代人类，而是放大每个人的潜能。<br>适应变化、持续学习、保持好奇心——是面向未来最好的策略。</p></div>
  <div class="grid">
    <div class="card">
      <h3>学习</h3>
      <p>拥抱终身学习，建立 AI 时代的知识体系</p>
    </div>
    <div class="card">
      <h3>适应</h3>
      <p>灵活调整职业路径，利用 AI 工具提升效率</p>
    </div>
    <div class="card">
      <h3>创造</h3>
      <p>专注于人类独有的创造力、判断力与共情能力</p>
    </div>
  </div>
</div>
</body></html>
