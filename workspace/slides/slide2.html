<!DOCTYPE html>
<html>
<head>
<style>
html { background: #F4F6F6; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #F4F6F6; font-family: Arial, sans-serif;
  display: flex;
}
.sidebar {
  width: 220pt; background: #1C2833; padding: 36pt 28pt;
  display: flex; flex-direction: column; justify-content: center;
}
.sidebar h2 {
  color: #FFFFFF; font-size: 28pt; margin: 0 0 8pt 0;
}
.sidebar p {
  color: #5EA8A7; font-size: 13pt; margin: 0;
}
.main {
  flex: 1; padding: 40pt 36pt;
  display: flex; flex-direction: column; justify-content: center;
}
.main h3 {
  color: #1C2833; font-size: 20pt; margin: 0 0 18pt 0;
}
.main ul {
  margin: 0; padding-left: 20pt;
}
.main li {
  color: #2E4053; font-size: 15pt; margin-bottom: 10pt;
  line-height: 1.5;
}
.main li b {
  color: #1C2833;
}
</style>
</head>
<body>
  <div class="sidebar">
    <h2>核心功能</h2>
    <p>html2pptx workflow</p>
  </div>
  <div class="main">
    <h3>该 Skill 支持以下能力</h3>
    <ul>
      <li><b>HTML 转 PPTX：</b>基于 HTML + CSS 精确定位生成幻灯片</li>
      <li><b>图表支持：</b>通过 PptxGenJS 嵌入柱状图、折线图、饼图等</li>
      <li><b>模板复用：</b>基于现有 PPTX 模板进行内容替换与重排</li>
      <li><b>缩略图预览：</b>自动生成缩略图用于视觉校验</li>
      <li><b>文本提取：</b>支持从 PPTX 中提取和编辑文本内容</li>
    </ul>
  </div>
</body>
</html>
